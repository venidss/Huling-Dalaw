; Export presets for DAET: ANG PAMANA
;
; This file is a template — Godot will overwrite it with the full configuration when you
; first open the editor and press "Save" in Project > Export. The settings below give you
; sensible mobile-friendly defaults for Android and a desktop fallback.
;
; Prerequisites for the Android preset:
;   1. Install Godot 4.2 or newer.
;   2. In Godot: Editor > Manage Export Templates > Download and install the official
;      templates for your Godot version.
;   3. Install the Android build tools: JDK 17+, Android SDK (platform-tools + build-tools
;      34+), and set paths in Editor > Editor Settings > Export > Android.
;   4. Install the latest Android keystore for signing. The debug keystore is auto-managed
;      by Godot; for release builds, generate your own with `keytool`.

